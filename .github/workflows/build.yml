name: Build BedFight

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check sources were pushed
        run: |
          COUNT=$(find src/main/java -name '*.java' | wc -l)
          echo "Java files found: $COUNT"
          test "$COUNT" -ge 40 || { echo "::error::src/main/java is missing or incomplete in the repo"; exit 1; }
          test -f src/main/resources/plugin.yml || { echo "::error::plugin.yml missing"; exit 1; }

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Verify jar contents
        run: |
          JAR=target/BedFight-1.3.0.jar
          ls -la target/*.jar
          unzip -l "$JAR" | grep -E "plugin.yml|BedFightPlugin.class|org/sqlite/JDBC.class" || true
          unzip -l "$JAR" | grep -q "com/example/bedfight/BedFightPlugin.class" || { echo "::error::BedFightPlugin.class is NOT in the jar"; exit 1; }
          unzip -l "$JAR" | grep -q " plugin.yml" || { echo "::error::plugin.yml is NOT in the jar"; exit 1; }
          unzip -l "$JAR" | grep -q "org/sqlite/JDBC.class" || { echo "::error::sqlite-jdbc is NOT in the jar"; exit 1; }
          echo "Jar OK: $(unzip -l "$JAR" | grep -c 'com/example/bedfight/') plugin class files"

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: BedFight-jdk${{ matrix.java }}
          path: target/BedFight-1.3.0.jar
          if-no-files-found: error
