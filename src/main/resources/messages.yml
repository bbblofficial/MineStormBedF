# ---------------------------------------------------------------------------
# BedFight messages.yml   (reload with /bedfight reload)
#
# Every text the plugin sends lives here. Theme: aqua (&b) + white (&f).
#  - Colour codes use &.   - {placeholders} are replaced by the plugin.
#  - Set a message to "" to hide it.
#  - New keys are merged in automatically on update; your edits are never overwritten.
# ---------------------------------------------------------------------------

# Put in front of every chat message
prefix: "&bBedFight &f» &r"

no-permission: "&fYou don't have permission to do that."
players-only: "&fOnly players can use this command."

# /bedfight creator   (the "Created by Itz_nanm" line is always shown)
creator:
  lines:
    - "&b&m                                   "
    - "&b&lBedFight &fv{version}"
    - "&bCreated by &fItz_nanm"
    - "&b&m                                   "

lobby:
  set: "&bLobby set in world &f{world} &bat &f{x}, {y}, {z}&b."
  unknown-world: "&fUnknown world '&b{world}&f'. Loaded worlds: &b{worlds}"
  match-world: "&fYou can't set the lobby inside a running match world."
  save-failed: "&fCould not save the lobby location (see console)."

command:
  unknown-sub: "&fUnknown sub-command. Usage: &b/bedfight [1v1|2v2|3v3|private|spec <player>|kiteditor|leave|creator]"
  no-play-permission: "&fYou don't have permission to play BedFight."
  no-spectate-permission: "&fYou don't have permission to spectate."
  private-mvp-only: "&fOnly &bMVP++ &fplayers can create private matches."
  already-busy: "&fYou are already in a queue or match."
  not-in-game: "&fYou are not in a BedFight queue, match or spectating."
  spec-usage: "&fUsage: &b/bedfight spec <player>"
  spec-offline: "&fPlayer '&b{player}&f' is not online."
  kit-busy: "&fYou can't edit your kit while you are in a queue, a match or spectating."
  kit-reset: "&bYour kit layout was reset to the default."
  admin-kit-reset: "&bKit reset to the default (iron sword, 64 wool, shears, golden apple, leather armor)."
  reloaded: "&bReloaded config.yml, settings.yml, messages.yml, voices.yml, scoreboard.yml, kit.yml and arenas."
  buildmode-on: "&bBuild mode enabled. You can edit protected arena worlds. Run again to disable it."
  buildmode-off: "&fBuild mode disabled. The map is protected again."

# Arena setup (admin commands)
setup:
  need-session: "&fStart with &b/bedfight setuparena <world_name> &for &b/bedfight edit <arena> &ffirst."
  setuparena-usage: "&fUsage: &b/bedfight setuparena <world_name>"
  setuparena-ok: "&bWorld '&f{world}&b' loaded. You are now setting up arena '&f{arena}&b'. Next: /bedfight po1, po2, setspawn, createteam, setteam, setbed, save."
  save-ok: "&bArena '&f{arena}&b' saved to arenas/{arena}.yml"
  edit-usage: "&fUsage: &b/bedfight edit <arena> [po1|po2|setspawn|createteam|removeteam|setteam|setbed|info ...] &fSaved arenas: &b{arenas}"
  edit-ok: "&bEditing arena '&f{arena}&b'. Build mode is ON (turn it off with /bedfight buildmode). Change anything with po1, po2, setspawn [team], createteam, removeteam, setteam, setbed and finish with /bedfight save."
  bound-usage: "&fUsage: &b/bedfight {sub} [x y z] &f(whole numbers)"
  bound-usage-short: "&fUsage: &b/bedfight {sub} [x y z]"
  bound-set: "&b{sub} &fset to block &b{x}, {y}, {z}&f."
  bound-feet: " &f(feet block; the block you stand on is Y &b{y}&f)"
  bound-levels: " &fVoid level (min Y) = &b{min}&f, max build height (max Y) = &b{max}&f."
  bound-warning: "&bWarning: &fonly &b{blocks} &fblocks between void level and build limit. Set one point at the lowest void level and one high above the islands."
  game-spawn-set: "&bGame spawn set &f(used by every team without its own /bedfight setspawn <team>)."
  wait-spawn-set: "&bWaiting spawn of team {team} &bset. &fIts dead players wait here until they respawn (the team's fighting spawn is still /bedfight setteam)."
  team-usage-remove: "&fUsage: &b/bedfight removeteam <color>"
  team-usage-create: "&fUsage: &b/bedfight createteam <color>"
  team-missing: "&fThat team doesn't exist in this arena."
  team-removed: "&bTeam {team} &bremoved. &fSave with /bedfight save."
  team-unknown-color: "&fUnknown color. Valid: &b{colors}"
  team-created: "&bTeam {team} &bcreated. &fNow use /bedfight setteam and /bedfight setbed."
  team-not-found: "&fThat team doesn't exist. Use &b/bedfight createteam <color> &ffirst."
  team-none-selected: "&fNo team selected. Use &b/bedfight createteam <color> &for pass the color."
  team-spawn-no-block: "&fStand on a solid block - the block under your feet is the spawn."
  team-spawn-set: "&bSpawn of team {team} &bset to block &f{x}, {y}, {z}&b."
  bed-not-found: "&fLook at the team's bed (within 6 blocks) and run the command again."
  bed-set: "&bBed of team {team} &bregistered at &f{x}, {y}, {z}&b."
  info-header: "&bArena &f{arena} &b(world &f{world}&b)"
  info-bounds: " &bpo1: &f{po1}   &bpo2: &f{po2}"
  info-levels: " &bVoid level (min Y): &f{min}   &bmax build height (max Y): &f{max}"
  info-spawn: " &bGame spawn: &f{spawn}"
  info-team: " &bTeam {team}&b: spawn &f{spawn}&b, bed &f{bed}&b, waiting spawn &f{wait}"
  pos-not-set: "&fnot set"

arena:
  protected: "&fThis arena is protected. Use &b/bedfight buildmode &fto edit it."
  no-saved: "&fNo saved arena called '&b{name}&f'. Saved arenas: &b{arenas}"
  no-session: "&fNo arena setup in progress. Use &b/bedfight setuparena <world_name>&f."
  write-failed: "&fCould not write {file}: {error}"
  invalid-world: "&fInvalid world name."
  world-not-found: "&fWorld folder '&b{world}&f' (with level.dat) not found in {path}"
  world-load-failed: "&fFailed to load world '&b{world}&f'."

queue:
  leader-only: "&fOnly your party leader can queue the party."
  party-too-large: "&fYour party is too large for &b{mode}&f."
  member-busy: "&b{player} &fis already in a queue, match or spectating."
  no-arenas: "&fNo arenas are available right now."
  joined: "&bJoined the &f{mode} &bqueue &f({queued}/{needed})&b. Use &f/bedfight leave &bto leave."
  party-left: "&b{player} &fleft the queue, so your party left it too."
  left: "&bYou left the queue."
  left-match: "&bYou left the BedFight match."
  stopped-spectating: "&bYou stopped spectating."
  private-leader-only: "&fOnly the party leader can start a private match."
  private-no-arenas: "&fThere are no arenas available."
  private-size: "&fA &b{mode} &fneeds exactly &b{needed} &fplayers in your party (you have &b{have}&f)."

spectate:
  unavailable: "&fThat player is no longer available."
  disabled: "&fSpectating is disabled."
  self: "&fYou can't spectate yourself."
  leave-first: "&fLeave your queue or match first."
  not-running: "&fThat match is not running."
  not-allowed: "&fThat match does not allow spectators."
  now-spectating: "&bYou are now spectating &f{player}&b. Use /leave to stop."

match:
  preparing: "&fPreparing your &b{arena} &farena..."
  your-team: "&fYou are on team {team}&f."
  time-limit: "&bThe time limit was reached."
  cancelled: "&f{reason} &bThe match was cancelled."
  draw: "&bThe match ended in a draw."
  team-wins: "{team} &fteam wins the match!"
  disconnected: "&b{player} &fdisconnected."
  left: "&b{player} &fleft the match."
  own-bed: "&fYou can't break your own bed!"
  bed-destroyed: "&fThe bed of team {team} &fwas destroyed by {killer}&f!"
  killed-by: "{player} &fwas killed by {killer}&f."
  died: "{player} &fdied."
  cannot-build: "&fYou cannot build here!"
  cannot-break: "&fYou can only break blocks placed by players! (&b{block}&f)"
  abort:
    prepare: "Could not prepare the arena."
    load: "Could not load the arena."
    player-left: "A player left before the match started."
    named-left: "{player} left before the match started."

# On-screen titles: title / subtitle
titles:
  countdown:
    title: "&b&l{count}"
    subtitle: "&fGet ready to fight!"
  fight:
    title: "&b&lFIGHT!"
    subtitle: "&fTeam {team}"
  victory:
    title: "&b&lVICTORY!"
    subtitle: "&fYou won the BedFight!"
  defeat:
    title: "&f&lDEFEAT"
    subtitle: "&bBetter luck next time!"
  draw:
    title: "&b&lDRAW"
    subtitle: ""
  bed-destroyed:
    title: "&f&lBED DESTROYED!"
    subtitle: "&bYou will no longer respawn!"
  eliminated:
    title: "&f&lELIMINATED"
    subtitle: "&bYou can't respawn."
  respawned:
    title: "&b&lRESPAWNED"
    subtitle: ""
  died:
    title: "&f&lYOU DIED!"
    subtitle: "&bRespawning in &f{seconds}s"
